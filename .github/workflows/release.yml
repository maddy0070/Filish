# Builds FILISH from source and publishes the APK two ways: as a workflow
# artifact (retained 90 days, for anyone with repository access) and as an
# asset on a GitHub Release (a permanent, public download).
#
# The APK is never committed. It is built here, from the tagged source, every
# time - which is the only way a published binary can be shown to correspond
# to the code it claims to come from.
name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create or update the release for'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, verify and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing as ${TAG}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # A release that fails its own tests is not a release. This is the gate,
      # not a formality: if it goes red, nothing is published.
      - name: Run the test suite
        run: ./gradlew --no-daemon testDebugUnitTest

      # Decodes a real signing key when the repository secrets are configured.
      # Without them the release falls back to the debug key (see
      # app/build.gradle.kts) - still installable, but not upgradable across
      # builds, which the release notes state plainly.
      - name: Prepare the release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FILISH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/filish-release.jks"
            echo "path=${RUNNER_TEMP}/filish-release.jks" >> "$GITHUB_OUTPUT"
            echo "signed_with=a release key from repository secrets" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "signed_with=the Android debug key (no release keystore configured)" >> "$GITHUB_OUTPUT"
            echo "::warning::No FILISH_KEYSTORE_BASE64 secret. Falling back to the debug signing key: the APK installs, but cannot be upgraded over a differently-signed build."
          fi

      - name: Build the release APK
        env:
          FILISH_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          FILISH_KEYSTORE_PASSWORD: ${{ secrets.FILISH_KEYSTORE_PASSWORD }}
          FILISH_KEY_ALIAS: ${{ secrets.FILISH_KEY_ALIAS }}
          FILISH_KEY_PASSWORD: ${{ secrets.FILISH_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name it, and verify it is genuinely signed
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "${SRC}" ]; then echo "No APK produced"; exit 1; fi
          echo "Built: ${SRC}"

          mkdir -p dist
          cp "${SRC}" dist/FILISH-release.apk

          BUILD_TOOLS=$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)
          # An unsigned APK cannot be installed, so a release that ships one is
          # a broken download. Fail loudly rather than publish it.
          "${BUILD_TOOLS}/apksigner" verify --print-certs -v dist/FILISH-release.apk

          SIZE=$(stat -c '%s' dist/FILISH-release.apk)
          SHA=$(sha256sum dist/FILISH-release.apk | cut -d' ' -f1)
          sha256sum dist/FILISH-release.apk > dist/FILISH-release.apk.sha256

          VERSION=$("${BUILD_TOOLS}/aapt2" dump badging dist/FILISH-release.apk \
            | grep -m1 '^package' || true)

          {
            echo "size=${SIZE}"
            echo "size_mb=$(awk -v b="${SIZE}" 'BEGIN{printf "%.2f", b/1048576}')"
            echo "sha=${SHA}"
          } >> "$GITHUB_OUTPUT"

          echo "### FILISH-release.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: ${SIZE} bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`${SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      # (1) The workflow artifact.
      - name: Upload the workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FILISH-release-apk
          path: |
            dist/FILISH-release.apk
            dist/FILISH-release.apk.sha256
          if-no-files-found: error
          retention-days: 90

      # (2) The GitHub Release asset. Uses the preinstalled gh CLI rather than a
      # third-party action, so nothing outside GitHub touches the artifact.
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          SIZE: ${{ steps.apk.outputs.size }}
          SIZE_MB: ${{ steps.apk.outputs.size_mb }}
          SHA: ${{ steps.apk.outputs.sha }}
          SIGNED_WITH: ${{ steps.signing.outputs.signed_with }}
        run: |
          set -euo pipefail

          cat > dist/notes.md <<EOF
          An offline-first Android file manager.

          ## Download

          **[FILISH-release.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/FILISH-release.apk)** — ${SIZE_MB} MB (${SIZE} bytes)

          \`\`\`
          SHA-256  ${SHA}
          \`\`\`

          Built by [this workflow run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) from \`${GITHUB_SHA}\`, with the test suite passing. R8 minification and resource shrinking enabled.

          ## Before you install

          Signed with ${SIGNED_WITH}.

          Android blocks installs from outside the Play Store by default. You will need to allow your browser or file manager to install unknown apps when prompted. Requires **Android 8.0 (API 26)** or newer.

          If this was signed with the debug key, note that each CI run generates a different debug keystore, so Android will refuse to install this over a previously installed FILISH. Uninstall the old one first. Configure the \`FILISH_KEYSTORE_BASE64\`, \`FILISH_KEYSTORE_PASSWORD\`, \`FILISH_KEY_ALIAS\` and \`FILISH_KEY_PASSWORD\` repository secrets to produce properly signed, upgradable builds.

          ## Permissions

          FILISH declares **no \`INTERNET\` permission** — the process cannot open a network socket. Verifiable in Android's app info screen. It asks for all-files access to browse your storage, and works with media-only access if you decline.

          ## Known gaps

          File operations do not survive the process being killed, audio has no background playback, and archive support is not implemented. See [docs/platform-constraints.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/platform-constraints.md).
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists - updating it and replacing the asset."
            gh release edit "${TAG}" \
              --title "FILISH ${TAG}" \
              --notes-file dist/notes.md
            gh release upload "${TAG}" \
              dist/FILISH-release.apk \
              dist/FILISH-release.apk.sha256 \
              --clobber
          else
            echo "Creating release ${TAG}."
            gh release create "${TAG}" \
              dist/FILISH-release.apk \
              dist/FILISH-release.apk.sha256 \
              --title "FILISH ${TAG}" \
              --notes-file dist/notes.md \
              --target "${GITHUB_SHA}"
          fi

          echo "Release URL: $(gh release view "${TAG}" --json url -q .url)"
